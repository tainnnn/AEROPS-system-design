<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75"><meta name="description" content="Airport Operations Management System — interactive presentation prototype with fictional data.">
  <title>AEROPS · Airport Operations</title>
  <style>@charset "UTF-8";
@layer reset, base, layout, components, responsive;

/* Keep hidden accessibility labels inside the viewport, even in scrollable tables. */
.sr-only { left:0!important; top:0!important; }

@layer components {
  .demo-clock { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; white-space:nowrap; }
  .demo-clock input { width:94px; padding:6px 8px; min-height:34px; font-size:12px; }
  .bar-chart:has(> .bar-column) { overflow-x:auto; }
  .bar-column { min-width:24px; }
}
@layer responsive {
  @media (max-width:1100px) {
    .demo-clock span, .top-demo { display:none; }
    .demo-clock input { width:82px; }
    .topbar-actions { gap:8px; }
    .breadcrumb strong { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  }
  @media (max-width:550px) {
    .topbar .breadcrumb > span, .topbar .breadcrumb > strong, .topbar .breadcrumb > svg { display:none; }
    .topbar .topbar-actions { flex:1; justify-content:flex-end; gap:5px; }
    .demo-clock input { width:80px; font-size:11px; }
  }
  @media print { .demo-clock { display:none; } }
}

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  img, svg { vertical-align: middle; }
  a { color: inherit; text-decoration: none; }
  button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
}

@layer base {
  :root { --canvas:#f5f6f8; --surface:#fff; --ink:#172b36; --muted:#7a8790; --line:#e9edef; --teal:#087f75; --teal-dark:#05685f; --teal-soft:#e9f5f1; --amber:#b7791f; --red:#c34848; --radius:12px; --shadow:0 5px 20px #20303c05; }
  body { background:var(--canvas); color:var(--ink); font-family:"Segoe UI",Tahoma,Arial,sans-serif; font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { color:inherit; }
  button { background:none; border:0; }
  input, select, textarea { border:1px solid #dfe5e8; background:#fff; border-radius:7px; padding:10px 12px; outline:none; min-width:0; }
  input::placeholder, textarea::placeholder { color:#9aa5ac; }
  input:focus, select:focus, textarea:focus { border-color:#4f9b92; box-shadow:0 0 0 3px #087f7510; }
  textarea { resize:vertical; min-height:86px; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  :focus-visible { outline:3px solid #28a99788; outline-offset:3px; }
  h1,h2,h3,h4,p { margin:0; }
  h2 { font-size:16px; font-weight:650; }
  h3 { font-size:14px; font-weight:650; }
  svg { flex-shrink:0; width:18px; height:18px; }
  .muted { color:var(--muted); }
  .small, small { font-size:11px; }
  .mono { font-family:Consolas,"SFMono-Regular",monospace; letter-spacing:-.2px; }
  .helper { color:var(--muted); font-size:12px; line-height:1.7; }
  .eyebrow { color:var(--teal); font-size:10px; letter-spacing:1.8px; font-weight:700; text-transform:uppercase; margin-bottom:8px; }
}

@layer layout {
  .app-shell { display:flex; min-height:100vh; }
  .sidebar { width:232px; flex:0 0 232px; position:fixed; top:0; bottom:0; left:0; background:var(--surface); border-right:1px solid var(--line); padding:28px 15px 16px; z-index:40; display:flex; flex-direction:column; overflow-y:auto; }
  .workspace { width:calc(100% - 232px); margin-left:232px; min-width:0; }
  .topbar { height:76px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 34px; gap:16px; position:sticky; top:0; z-index:25; }
  .page-content { max-width:1760px; margin:0 auto; padding:32px 34px 40px; }
  .page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:26px; }
  .page-title { font-size:29px; font-weight:650; line-height:1.35; letter-spacing:-.7px; }
  .page-subtitle { color:var(--muted); margin-top:7px; font-size:12px; }
  .heading-actions { display:flex; gap:9px; align-items:center; padding-top:14px; flex-shrink:0; }
  .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:17px; margin-bottom:24px; }
  .dashboard-grid { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:22px; align-items:start; }
  .dashboard-grid > * { min-width:0; }
  .dashboard-grid > :first-child > .panel + .panel { margin-top:22px; }
  .dashboard-grid > :last-child > .panel + .panel { margin-top:20px; }
  .detail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .full { grid-column:1/-1; }
}

@layer components {
  .brand { display:flex; align-items:center; gap:10px; margin:0 9px 34px; font-size:21px; line-height:1; font-weight:750; letter-spacing:1.4px; }
  .brand > div:last-child small, .brand small { display:block; color:#8e9aa0; font-size:8px; font-weight:500; letter-spacing:1.2px; margin-top:7px; }
  .brand-mark { background:var(--teal); border-radius:9px; width:36px; height:36px; color:#fff; display:grid; place-items:center; box-shadow:0 3px 8px #087f751a; }
  .brand-mark svg { width:22px; height:22px; }
  .nav-section { margin:0 12px 10px; padding-top:20px; color:#a0aab0; text-transform:uppercase; font-size:9px; font-weight:650; letter-spacing:1.5px; }

  .nav-item:hover { color:var(--ink); background:#f5f7f7; }
  .nav-item.active { background:var(--teal-soft); color:var(--teal); font-weight:650; }
  .nav-item.active::before { content:""; position:absolute; left:-15px; top:13px; bottom:13px; width:3px; background:var(--teal); border-radius:0 3px 3px 0; }
  .nav-icon { display:flex; color:#8e9aa1; }
  .nav-item.active .nav-icon { color:var(--teal); }
  .nav-label { flex:1; min-width:0; }
  .nav-count { color:#8b989e; font-size:10px; min-width:20px; border-radius:4px; background:#f1f3f4; padding:0 4px; text-align:center; }
  .nav-item.active .nav-count { color:var(--teal); background:#d9ebe5; }
  .sidebar-bottom { margin-top:auto; padding:28px 9px 0; }
  .sidebar-bottom .btn { margin-top:9px; width:100%; justify-content:flex-start; }
  .demo-badge { display:inline-flex; align-items:center; gap:6px; color:var(--teal); font-size:9px; font-weight:700; letter-spacing:1px; background:var(--teal-soft); border-radius:4px; padding:4px 7px; }
  .sidebar-bottom p { margin-top:8px; font-size:10px; color:#95a0a6; line-height:1.7; }

  .icon-button { width:34px; height:34px; display:inline-grid; place-items:center; border-radius:7px; color:#7c8a94; position:relative; }
  .icon-button:hover { background:#f2f6f5; color:var(--teal); }
  .icon-button .dot, .notification-dot { width:6px; height:6px; background:#e0a15c; border:1.5px solid #fff; border-radius:50%; position:absolute; top:6px; right:8px; }
  .menu-toggle { display:none; }
  .stat-card { border:1px solid var(--line); background:var(--surface); padding:20px 20px 15px; border-radius:var(--radius); box-shadow:var(--shadow); }
  .stat-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .stat-icon { width:33px; height:33px; display:grid; place-items:center; color:var(--teal); background:#edf7f4; border-radius:8px; }
  .stat-icon.amber { background:#fef5e8; color:#c38b34; }
  .stat-icon.blue { background:#eef3fa; color:#5680ab; }
  .stat-icon.purple { background:#f1eff8; color:#8d77b4; }
  .stat-value { font-size:31px; font-weight:600; letter-spacing:-1.2px; line-height:1.35; color:#203740; }
  .stat-label { color:#87939b; font-size:11px; }
  .stat-foot { margin-top:10px; color:#9ba5aa; font-size:10px; display:flex; align-items:center; gap:6px; }
  .stat-foot strong { color:var(--teal); font-weight:600; }
  .stat-foot .amber, .stat-foot.amber { color:#bd8b3c; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .panel + .panel { margin-top:22px; }
  .panel-head { padding:21px 22px 16px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .panel-title { font-size:14px; color:#273c46; font-weight:650; letter-spacing:-.2px; }
  .panel-head .muted { margin-top:3px; font-size:10px; }
  .panel-body { padding:0 22px 22px; }
  .toolbar { display:flex; align-items:center; gap:10px; padding:0 22px 17px; flex-wrap:wrap; }
  .toolbar > select { font-size:11px; padding:7px 11px; min-height:34px; }
  .toolbar .search-input { margin-right:auto; }
  .search-input { font-size:11px; min-height:34px; padding:8px 11px; width:220px; background:#fafbfc; }
  .table-wrap { overflow-x:auto; width:100%; scrollbar-width:thin; }
  .data-table { width:100%; border-collapse:collapse; font-size:11px; text-align:left; white-space:nowrap; }
  .data-table th { text-transform:uppercase; color:#8c99a1; font-size:9px; letter-spacing:.45px; font-weight:600; background:#fafbfc; padding:12px 17px; border-top:1px solid #f0f2f3; border-bottom:1px solid var(--line); }

  .flight-cell { display:flex; align-items:center; gap:10px; }

  .airline-logo.purple { background:#f2eaf8; color:#8253a4; }

  .route { display:inline-flex; align-items:center; gap:8px; color:#46606b; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid #e1e7e8; background:#fff; border-radius:7px; padding:9px 13px; color:#61717b; font-size:11px; line-height:1.6; font-weight:500; transition:background .15s,border-color .15s,transform .15s; min-height:35px; }

  .btn svg { width:14px; height:14px; }

  .btn-ghost:hover { background:#f2f7f5; border-color:transparent; }
  .btn-danger { background:#fff4f3; color:#c05751; border-color:#f4dedb; }
  .btn-danger:hover { background:#fce8e6; border-color:#ebc4be; color:#b54f48; }
  .btn-sm { min-height:28px; padding:5px 9px; font-size:10px; border-radius:5px; }
  .badge, .pill { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:3px 8px; border-radius:5px; font-size:9px; font-weight:500; line-height:1.7; white-space:nowrap; background:#eff2f4; color:#8a98a1; }
  .badge.green, .pill.green { color:#328568; background:#edf7f0; }

  .badge.blue, .pill.blue { color:#5d85b0; background:#eef4fb; }

  .timeline-time { color:#99a5ab; font-size:10px; }

  A.actions.nav=e=>A.navigate(e.dataset.page);
  A.actions.closeModal=()=>document.getElementById('modal').close();
  A.actions.menu=()=>document.body.classList.toggle('nav-open');
  A.actions.guide=()=>A.modal('เส้นทางนำเสนอ · ประมาณ 5–8 นาที',`<p class="helper">ใช้โหมดนำเสนอเพื่อเดินทุกขั้นตอนได้ทันที หรือสลับบทบาทจากมุมขวาบนเพื่อสาธิตสิทธิ์แต่ละฝ่าย</p><div class="guide-list">${[
    ['flights','01','เปิดเที่ยวบิน TG405','ดูผู้โดยสาร ทรัพยากร งานภาคพื้น และ Timeline ในหน้าเดียว'],
    ['resources','02','ลองจอง Gate ที่มีเวลาทับซ้อน','เลือก TG612 · A04 · 10:30–11:30 จะถูกปฏิเสธ จากนั้นเปลี่ยนเป็น B04 เพื่อบันทึกสำเร็จ'],
    ['passengers','03','เช็กอิน Ploy Demo','เปลี่ยนสถานะจากจองแล้วเป็นเช็กอินแล้ว ก่อนลงทะเบียนสัมภาระ'],
    ['baggage','04','ออก Baggage Tag','เลือก Ploy Demo เพิ่มสัมภาระ 2 ชิ้น แล้วค้นหา Tag และอัปเดตสถานะ'],
    ['ground','05','มอบหมายและทำงานภาคพื้น','มอบหมาย T01 ให้ Kittipong Demo และ Belt loader 01 จากนั้นสลับ Ground Staff เพื่อเริ่ม / เสร็จงาน'],
    ['reports','06','ปิดด้วยรายงานและ Audit Log','ส่งออก Excel หรือพิมพ์ PDF แล้วสลับ Admin เพื่อตรวจสอบผู้แก้ไขและรายละเอียด']
  ].map(([page,num,title,text])=>`<button class="guide-step" data-action="guideGo" data-page="${page}"><span class="guide-number">${num}</span><span><strong class="guide-step-title">${title}</strong><span class="muted small">${text}</span></span>${A.icon('arrow')}</button>`).join('')}</div><div class="warning-box">Prototype ใช้ข้อมูลสมมติและบันทึกในเบราว์เซอร์ · ใช้ปุ่มรีเซ็ตข้อมูลตัวอย่างเพื่อเริ่มนำเสนอใหม่</div>`);
  A.actions.guideGo=e=>{document.getElementById('modal').close();if(!canView(e.dataset.page))return A.toast('บทบาทนี้ไม่มีสิทธิ์ในหน้านี้ กรุณาเลือกโหมดนำเสนอหรือบทบาทที่เกี่ยวข้องจากเมนูด้านบน');A.navigate(e.dataset.page);};
  A.actions.reset=()=>A.modal('เริ่มข้อมูลตัวอย่างใหม่',`<p>คืนข้อมูลสาธิตทุกหน้ากลับเป็นชุดเริ่มต้น? การแก้ไขใน Prototype รอบนี้จะถูกแทนที่ และเวลาจำลองจะกลับเป็น 10:30</p>`,()=>{db=makeAirportDemo();A.demoTime='10:30';A.page='dashboard';A.save();A.toast('พร้อมเริ่มสาธิตรอบใหม่แล้ว');},{submitLabel:'รีเซ็ตข้อมูลตัวอย่าง'});
  A.actions.demoClock=e=>{if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(e.value)){e.value=A.demoTime;return;}const before=A.demoTime;A.demoTime=e.value;A.log('เปลี่ยนเวลาจำลอง','DEMO',before+' → '+A.demoTime);A.save();A.toast('เวลาจำลอง '+A.demoTime+' · อัปเดตการแจ้งเตือนแล้ว');};
  A.actions.switchRole=e=>{const next=e.value;if(!roles[next])return;if(next!=='presenter'&&!db.users.some(u=>u.role===next&&u.status==='Active')){A.toast('ไม่มีบัญชีที่เปิดใช้งานสำหรับบทบาทนี้');A.render();return;}A.log('ออกจากบทบาทสาธิต',A.actor,'role: '+A.role);A.role=next;try{sessionStorage.setItem('aerops-role',next);}catch(_){}A.log('เข้าสู่บทบาทสาธิต',A.actor,'role: '+next);if(!canView(A.page))A.page='dashboard';A.save();A.toast('สลับเป็น '+roles[next]);};
  A.actions.logout=()=>{A.log('ออกจากระบบสาธิต',A.actor,'session closed');try{sessionStorage.setItem('aerops-loggedout','1');localStorage.setItem(KEY,JSON.stringify(db));}catch(_){}renderLogin();};
  A.actions.login=()=>{const selected=document.querySelector('#login-role').value;A.role=selected;try{sessionStorage.removeItem('aerops-loggedout');sessionStorage.setItem('aerops-role',selected);}catch(_){}A.page='dashboard';A.log('เข้าสู่ระบบสาธิต',A.actor,'เลือกบทบาท '+selected);A.save();};
  function renderLogin(){document.getElementById('app').innerHTML=`<div class="login-screen"><section class="login-visual"><div class="brand"><span class="brand-mark">${A.icon('plane')}</span><span>AEROPS</span></div><div><div class="eyebrow">AIRPORT OPERATIONS MANAGEMENT</div><h1>Every flight.<br>One connected team.</h1><p>เชื่อมการปฏิบัติการสนามบิน<br>ตั้งแต่เที่ยวบินแรก จนสัมภาระชิ้นสุดท้าย</p></div><span class="small">SYSTEM PROTOTYPE · GROUP 1</span></section><section class="login-card"><div class="eyebrow">WELCOME TO AEROPS</div><h1>เริ่มต้นการสาธิต</h1><p class="muted">เลือกบทบาทเพื่อทดลองขั้นตอนการทำงาน</p><label class="field">บทบาทผู้ใช้งาน<select id="login-role">${Object.entries(roles).filter(([k])=>k==='presenter'||db.users.some(u=>u.role===k&&u.status==='Active')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><button class="btn btn-primary" data-action="login">เข้าสู่ระบบสาธิต ${A.icon('arrow')}</button><p class="helper">โหมดนำเสนอเข้าถึงได้ทุกหน้า · บทบาทอื่นจะแสดงเมนูตามสิทธิ์</p><div class="warning-box">นี่คือการจำลองการเข้าสู่ระบบสำหรับนำเสนอ ไม่ใช่ระบบยืนยันตัวตนจริง ข้อมูลทั้งหมดเป็นตัวอย่าง</div></section></div>`;}
  function headingAction(){if(A.page==='flights'&&A.allowed('flights'))return `<button class="btn btn-primary" data-action="editFlight">${A.icon('plus')} เพิ่มเที่ยวบิน</button>`;return `<button class="btn btn-ghost" data-action="guide">${A.icon('play')} คู่มือสาธิต</button>`;}
  A.render=()=>{
    const title=titles[A.page]||titles.dashboard,unread=db.notices.filter(n=>!n.read).length;
    document.title='AEROPS · '+title[0];
    document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><a class="brand" href="#" data-action="nav" data-page="dashboard"><span class="brand-mark">${A.icon('plane')}</span><span>AEROPS<small>AIRPORT OPERATIONS</small></span></a><div class="airport-selector"><span class="airport-monogram">BKK</span><div><strong>Suvarnabhumi</strong><span class="muted small">Bangkok · Terminal 1</span></div><span class="demo-badge">DEMO</span></div><nav aria-label="เมนูหลัก">${nav.map(([page,icon,label,section])=>`${section?`<div class="nav-section">${section}</div>`:''}${canView(page)?`<button type="button" class="nav-item ${page===A.page?'active':''}" data-action="nav" data-page="${page}" ${page===A.page?'aria-current="page"':''}><span class="nav-icon">${A.icon(icon)}</span><span class="nav-label">${label}</span>${page==='notifications'&&unread?`<span class="nav-count">${unread}</span>`:''}</button>`:''}`).join('')}</nav><div class="sidebar-bottom"><div class="demo-note"><span class="live-dot"></span><strong>Presentation prototype</strong><p>ข้อมูลสมมติ · บันทึกในเบราว์เซอร์</p></div><button class="nav-item" data-action="reset">${A.icon('refresh')}<span>รีเซ็ตข้อมูลตัวอย่าง</span></button><button class="nav-item" data-action="logout">${A.icon('logout')}<span>ออกจากระบบสาธิต</span></button></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb"><button class="icon-button menu-toggle" data-action="menu" aria-label="เปิดเมนู">${A.icon('menu')}</button><span>Workspace</span>${A.icon('chevron')}<strong>${title[0]}</strong></div><div class="topbar-actions"><label class="demo-clock"><span>เวลาจำลอง</span><input type="time" aria-label="เวลาจำลอง" data-change="demoClock" value="${h(A.demoTime)}" required></label><span class="demo-badge top-demo">DEMO MODE</span><label class="sr-only" for="role-select">สลับบทบาทสาธิต</label><select class="role-select" id="role-select" data-change="switchRole">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===A.role?'selected':''}>${v}</option>`).join('')}</select><button class="icon-button notification-button" data-action="nav" data-page="notifications" aria-label="การแจ้งเตือน ${unread} รายการ">${A.icon('bell')}${unread?'<i></i>':''}</button><span class="avatar" title="${h(A.actor)}">${A.role==='presenter'?'PR':A.role.slice(0,2).toUpperCase()}</span></div></header><main class="page-content"><div class="page-heading"><div><div class="eyebrow">AIRPORT OPERATIONS / ${A.page.toUpperCase()}</div><h1 class="page-title">${title[0]}</h1><p class="page-subtitle">${title[1]}</p></div><div class="heading-actions"><span class="date-label">${A.icon('clock')} 03 พ.ย. 2026</span>${headingAction()}</div></div><div id="page-body">${A.pages[A.page]?A.pages[A.page]():'<div class="empty">กำลังเตรียมหน้า</div>'}</div><footer class="page-footer"><span>AEROPS · Airport Operations Management System</span><span>Prototype · ข้อมูลจำลอง · UTC+7</span></footer></main></div></div>`;
  };
  A.init=()=>{
    db.demoTime=A.demoTime;A.checkOperationalAlerts();
    try{const stored=sessionStorage.getItem('aerops-role');if(roles[stored])A.role=stored;}catch(_){}
    document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;event.preventDefault();const action=A.actions[el.dataset.action];if(action)action(el,event);});
    document.addEventListener('change',event=>{const el=event.target.closest('[data-change]');if(el&&A.actions[el.dataset.change])A.actions[el.dataset.change](el,event);});
    document.addEventListener('input',event=>{if(!event.target.matches('[data-table-search]'))return;const q=event.target.value.toLowerCase().trim();let visible=0;document.querySelectorAll('#page-body .searchable').forEach(row=>{row.hidden=!(row.dataset.searchtext||row.textContent).toLowerCase().includes(q);if(!row.hidden)visible++;});let e=document.getElementById('search-empty');if(!e){e=document.createElement('p');e.id='search-empty';e.className='empty';e.textContent='ไม่พบข้อมูลที่ตรงกับคำค้น';document.querySelector('#page-body').appendChild(e);}e.hidden=visible>0;});
    document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const rect=e.currentTarget.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)e.currentTarget.close();}});
    try{if(sessionStorage.getItem('aerops-loggedout')==='1')return renderLogin();}catch(_){}A.render();
  };
})();
</script><script>/* Airport Operations Management — presentation modules. All records are fictional. */
(() => {
  'use strict';
  const A = window.AO;
  const h = value => A.h(value == null ? '' : String(value));
  const ui = {personnelTab:'staff', reportStart:'2026-11-03', reportEnd:'2026-11-03', auditAction:'all',auditStart:'',auditEnd:''};
  let bagPassengerCandidates=[];
  const bagPassengerOptions=(passengers,selected='')=>`<option value="">${passengers.length?'เลือกผู้โดยสาร':'ไม่พบผู้โดยสารที่ตรงกับคำค้น'}</option>`+passengers.map(p=>`<option value="${h(p.id)}" ${p.id===selected?'selected':''}>${h(p.name)} · ${h(flightLabel(p.flightId))} · ${h(p.seat)}</option>`).join('');
  document.addEventListener?.('input',event=>{
    if(!event.target.matches?.('[data-bag-passenger-search]'))return;
    const select=document.getElementById('bag-passenger-select');if(!select)return;
    const query=event.target.value.trim().toLowerCase(),selected=select.value;
    const matches=bagPassengerCandidates.filter(p=>`${p.name} ${p.passport} ${flightLabel(p.flightId)}`.toLowerCase().includes(query));
    select.innerHTML=bagPassengerOptions(matches,matches.some(p=>p.id===selected)?selected:'');
  });
  const ready = status => ['พร้อมใช้งาน','ว่าง','Available','available','Ready','ready','พร้อมปฏิบัติงาน'].includes(status);
  const pending = status => ['รอดำเนินการ','Pending','pending','Scheduled','scheduled'].includes(status);
  const running = status => ['กำลังดำเนินการ','In progress','In Progress','in_progress'].includes(status);
  const done = status => ['เสร็จสิ้น','Completed','completed'].includes(status);
  const cancelled = status => ['ยกเลิก','Cancelled','cancelled'].includes(status);
  const checked = status => ['เช็กอินแล้ว','Checked-in','Checked in','checked-in','checked_in','Checked In','Boarded','ขึ้นเครื่องแล้ว'].includes(status);
  const bagReady = status => ['เช็กอินแล้ว','Checked-in','Checked in','checked-in','checked_in','Checked In'].includes(status);
  const busy = status => ['กำลังใช้งาน','ไม่ว่าง','Busy','busy','Assigned','assigned','ปฏิบัติงาน','On duty','In use'].includes(status);
  const can = permission => A.allowed(permission);
  const need = permission => {if(can(permission)) return true; A.toast('บทบาทนี้ไม่มีสิทธิ์แก้ไขข้อมูลส่วนนี้'); return false;};
  const flightLabel = id => {const f=A.flight(id); return f ? (f.no||f.number||id) : id;};
  const flightOptions = selected => A.db.flights.filter(f=>!cancelled(f.status)).map(f=>`<option value="${h(f.id)}" ${f.id===selected?'selected':''}>${h(f.no||f.number||f.id)} · ${h(f.from)} → ${h(f.to)}</option>`).join('');
  const optionList = (values,selected) => values.map(v=>`<option ${v===selected?'selected':''} value="${h(v)}">${h(v)}</option>`).join('');
  const field = (label,inner) => `<label class="field"><span>${label}</span>${inner}</label>`;
  const inp = (name,value='',type='text',attrs='') => `<input type="${type}" name="${name}" value="${h(value)}" ${attrs}>`;
  const status = value => A.badge(value||'—');
  const search = placeholder => `<input class="search-input" data-table-search placeholder="${h(placeholder)}" aria-label="${h(placeholder)}">`;
  const btn = (action,label,id='',cls='btn btn-ghost') => `<button class="${cls}" data-action="${action}" data-id="${h(id)}" type="button">${label}</button>`;
  const empty = text => `<div class="empty">${h(text)}</div>`;
  const table = (head,rows) => `<div class="table-wrap"><table class="data-table"><thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}">${empty('ยังไม่มีข้อมูลในรายการนี้')}</td></tr>`}</tbody></table></div>`;
  const row = (text,cells) => `<tr class="searchable" data-searchtext="${h(text)}">${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  const confirmRemove = (kind,item,onDelete) => A.modal(`ยืนยันลบ${kind}`,`<div class="warning-box">ลบ <strong>${h(item)}</strong> ออกจากข้อมูลสาธิต? การกระทำนี้จะถูกบันทึกในประวัติการใช้งาน</div>`,()=>{onDelete(); A.save();});
  const titleCase = value => ({passenger:'Passenger Service Agent',baggage:'Baggage Staff',supervisor:'Ground Handling Supervisor',ground:'Ground Staff',operations:'Operations Officer',gate:'Gate Agent',ramp:'Ramp Agent',admin:'Admin'})[value]||value;

  A.pages.passengers = () => {
    const rows=A.db.passengers.map(p=>row(`${p.name} ${p.passport} ${p.seat} ${flightLabel(p.flightId)} ${p.status}`,[`<strong>${h(p.name)}</strong><div class="muted mono">${h(p.id)}</div>`,`<span class="mono">${h(p.passport)}</span>`,`<strong class="mono">${h(flightLabel(p.flightId))}</strong>`,`<span class="mono">${h(p.seat)}</span>`,status(p.status),`<div class="row-actions">${can('passengers')?btn('passengerStatus','เปลี่ยนสถานะ',p.id)+btn('passengerEdit','แก้ไข',p.id)+btn('passengerDelete','ลบ',p.id,'btn btn-ghost danger-text'):''}</div>`])).join('');
    return `<div class="stat-grid"><div class="stat-card"><span class="muted">ผู้โดยสารทั้งหมด</span><strong>${A.db.passengers.length}</strong><small>ข้อมูลผู้โดยสารตัวอย่าง</small></div><div class="stat-card"><span class="muted">เช็กอิน / ขึ้นเครื่องแล้ว</span><strong>${A.db.passengers.filter(p=>checked(p.status)).length}</strong><small>จำนวนผู้โดยสารที่ผ่านการเช็กอิน</small></div><div class="stat-card"><span class="muted">สัมภาระที่เชื่อมโยง</span><strong>${A.db.bags.length}</strong><small>ติดตามแยกตาม Baggage Tag</small></div></div><section class="panel"><div class="panel-head"><div><h2>รายชื่อผู้โดยสาร</h2><p>จัดการข้อมูลและสถานะผู้โดยสารของแต่ละเที่ยวบิน</p></div>${can('passengers')?btn('passengerAdd','+ เพิ่มผู้โดยสาร','','btn btn-primary'):''}</div><div class="toolbar">${search('ค้นหาชื่อ หนังสือเดินทาง หรือเที่ยวบิน')}<span class="helper">ข้อมูลทั้งหมดเป็นข้อมูลสมมติ</span></div>${table(['ผู้โดยสาร','หนังสือเดินทาง','เที่ยวบิน','ที่นั่ง','สถานะ','จัดการ'],rows)}</section>`;
  };
  function passengerForm(id) {
    if(!need('passengers')) return;
    const p=A.db.passengers.find(p=>p.id===id)||{};
    A.modal(id?'แก้ไขข้อมูลผู้โดยสาร':'เพิ่มผู้โดยสาร',`<div class="form-grid">${field('ชื่อ–นามสกุล',inp('name',p.name,'text','required maxlength="100"'))}${field('เลขหนังสือเดินทาง',inp('passport',p.passport,'text','required maxlength="20"'))}${field('เที่ยวบิน',`<select name="flightId" required>${flightOptions(p.flightId)}</select>`)}${field('ที่นั่ง',inp('seat',p.seat,'text','required maxlength="5" placeholder="เช่น 12A"'))}</div><p class="helper">ไม่อนุญาตเลขหนังสือเดินทางหรือที่นั่งซ้ำในเที่ยวบินเดียวกัน</p>`,d=>{
      const flight=A.flight(d.flightId); d.name=d.name.trim(); d.passport=d.passport.trim().toUpperCase(); d.seat=d.seat.trim().toUpperCase();
      if(!d.name||!d.passport) return A.formError('กรุณากรอกชื่อและเลขหนังสือเดินทาง'),false;
      if(!/^([1-9]\d?)[A-K]$/.test(d.seat)) return A.formError('ระบุที่นั่งเป็นตัวเลข 1–99 ตามด้วย A–K เช่น 12A'),false;
      if(!flight||cancelled(flight.status)) return A.formError('เที่ยวบินนี้ไม่พร้อมรับผู้โดยสาร'),false;
      if(A.db.passengers.some(x=>x.id!==id&&x.flightId===d.flightId&&(x.passport===d.passport||x.seat===d.seat))) return A.formError('หนังสือเดินทางหรือที่นั่งซ้ำกับผู้โดยสารในเที่ยวบินเดียวกัน'),false;
      if(id&&p.flightId!==d.flightId&&A.db.bags.some(b=>b.passengerId===id)) return A.formError('ผู้โดยสารมีสัมภาระเชื่อมโยงแล้ว กรุณาจัดการสัมภาระก่อนย้ายเที่ยวบิน'),false;
      const before=JSON.stringify(p); if(id)Object.assign(p,d);else A.db.passengers.push({...d,id:A.id('P'),status:'Booked'});
      A.log(id?'แก้ไขผู้โดยสาร':'เพิ่มผู้โดยสาร',id||d.passport,`${id?'ก่อน: '+before+' → ':''}หลัง: ${JSON.stringify(d)}`); A.save(); A.toast('บันทึกข้อมูลผู้โดยสารแล้ว');
    });
